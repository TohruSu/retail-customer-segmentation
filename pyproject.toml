[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-meal-choice-case"
version = "0.1.0"
description = "Independent synthetic retail analytics and a hypothetical meal-choice strategy"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.8,<4",
    "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
]

[project.scripts]
retail-case = "retail_case.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
